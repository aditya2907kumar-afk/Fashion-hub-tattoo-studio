    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,600;1,700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Suppress benign WebSocket / HMR connection errors in preview environment
      window.addEventListener('error', function(event) {
        if (
          event?.filename?.includes('@vite/client') ||
          event?.message?.includes('WebSocket') ||
          String(event?.error?.stack).includes('@vite/client')
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (
          String(event?.reason?.stack).includes('@vite/client') ||
          String(event?.reason).includes('WebSocket')
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
  </head>
